version: "3.9"
services:
  playwright-vnc:
    build: .
    container_name: playwright-vnc
    shm_size: 2gb
    ports:
      - "8020:8020"   # noVNC 網頁
    volumes:
      - ./work:/work
      - ./:/app # 把錄製的檔案存到本機
    networks:
      - ollama-network
    env_file:
      - .env
networks:
  ollama-network:
    external: true
    name: sql_agent_app-network